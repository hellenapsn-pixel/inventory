<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Inventory</title>

    <link rel="icon" type="image/png" href="icon.png">

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(168, 85, 247, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(124, 58, 237, 0.2),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #09060d,
                    #160d20,
                    #0b0710
                );

            overflow-x: hidden;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-header {
            width: 42px;
            height: 42px;
            object-fit: contain;
            display: block;
        }

        .logo-area h1 {
            margin: 0;
        }

        /* =========================================
           CONTAINER
        ========================================= */

        .cadastro-container {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* =========================================
           CARD
        ========================================= */

        .cadastro-box {
            width: 100%;
            max-width: 520px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 22, 48, 0.97),
                    rgba(18, 11, 25, 0.98)
                );

            border: 1px solid rgba(168, 85, 247, 0.3);

            border-radius: 22px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(124, 58, 237, 0.08);

            position: relative;

            overflow: hidden;

            animation: aparecer 0.5s ease;
        }

        .cadastro-box::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: #9333ea;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.12;

            top: -80px;
            right: -50px;
        }

        .cadastro-box h2 {
            text-align: center;

            font-family: 'Orbitron', sans-serif;

            font-size: 24px;

            margin-bottom: 26px;

            color: white;

            position: relative;
        }

        /* =========================================
           CAMPOS
        ========================================= */

        .campo-cadastro {
            margin-bottom: 16px;

            position: relative;
        }

        .linha-dupla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .campo-cadastro label {
            display: block;

            margin-bottom: 6px;

            color: #ddd;

            font-weight: 600;

            font-size: 13px;
        }

        .campo-cadastro small {
            display: block;
            margin-top: 6px;
            color: #756a7e;
            font-size: 12px;
        }

        /* =========================================
           BOTÃO CRIAR CONTA
        ========================================= */

        .botao-criar-conta {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            font-family: 'Orbitron', sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        .botao-criar-conta:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(124, 58, 237, 0.35);

            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #c084fc
                );
        }

        /* =========================================
           LOGIN LINK / VOLTAR
        ========================================= */

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #92879c;

            font-size: 14px;

            position: relative;
        }

        .login-link a {
            color: #c084fc;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            color: white;
        }

        .voltar {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #746a7d;

            text-decoration: none;

            font-size: 13px;

            position: relative;
        }

        .voltar:hover {
            color: #c084fc;
        }

        /* =========================================
           MENSAGENS DE ERRO / SUCESSO
        ========================================= */

        #mensagemCadastro {
            display: none;
            position: relative;
        }

        /* =========================================
           ANIMAÇÃO
        ========================================= */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .cadastro-container {
                padding: 25px 12px;
            }

            .cadastro-box {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .cadastro-box h2 {
                font-size: 21px;
            }

            .linha-dupla {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo-area">
        <img src="icon.png" alt="Logo Inventory" class="logo-header">
        <h1>Inventory</h1>
    </div>

    <nav>

        <a href="index.html">
            Início
        </a>

        <a href="jogos">
            Jogos
        </a>

        <a href="biblioteca">
            Biblioteca
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="cadastro-container">

    <section class="cadastro-box">

        <h2>Criar conta</h2>

        <div class="erro" id="mensagemCadastro"></div>

        <form action="cadastro"
              method="POST"
              enctype="multipart/form-data">

            <div class="campo-cadastro">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome completo"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="username">Nome de usuário</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="@username"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="linha-dupla">

                <div class="campo-cadastro">
                    <label for="pais">País</label>
                    <input
                        type="text"
                        id="pais"
                        name="pais"
                        placeholder="Seu país"
                    >
                </div>

                <div class="campo-cadastro">
                    <label for="plataforma">Plataforma favorita</label>
                    <select id="plataforma" name="plataforma">

                        <option value="">
                            Selecione
                        </option>

                        <option value="PlayStation">
                            PlayStation
                        </option>

                        <option value="Xbox">
                            Xbox
                        </option>

                        <option value="PC">
                            PC
                        </option>

                        <option value="Nintendo">
                            Nintendo
                        </option>

                    </select>
                </div>

            </div>

            <div class="campo-cadastro">
                <label for="bio">Sobre você</label>
                <textarea
                    id="bio"
                    name="bio"
                    class="campo-resenha"
                    placeholder="Fale um pouco sobre você..."
                ></textarea>
            </div>

            <div class="campo-cadastro">
                <label for="foto">Foto de perfil</label>
                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                >
                <small>JPG, PNG ou WEBP, até 5MB.</small>
            </div>

            <button type="submit" class="botao-criar-conta">
                Criar conta
            </button>

        </form>

        <p class="login-link">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

        <a href="index.html" class="voltar">
            ← Voltar para o início
        </a>

    </section>

</main>

<script>

    const mensagensErro = {
        campos: "Preencha todos os campos obrigatórios.",
        email: "Digite um e-mail válido.",
        email_existente: "Já existe uma conta com esse e-mail.",
        username: "Esse nome de usuário já está em uso.",
        foto: "Não foi possível ler o arquivo da foto enviada.",
        formato: "Formato de foto inválido. Use JPG, PNG ou WEBP.",
        salvar: "Não foi possível concluir o cadastro. Tente novamente.",
        servidor: "Ocorreu um erro no servidor. Tente novamente mais tarde."
    };

    const parametros = new URLSearchParams(window.location.search);
    const erro = parametros.get("erro");
    const caixaMensagem = document.getElementById("mensagemCadastro");

    if (erro && mensagensErro[erro]) {
        caixaMensagem.textContent = mensagensErro[erro];
        caixaMensagem.style.display = "block";
    }

</script>

</body>

</html>
