
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Buscar usuários - Inventory</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background:
                radial-gradient(
                    circle at top,
                    #32134d,
                    #12091b 55%,
                    #09050d
                );
            min-height: 100vh;
        }

        .busca-container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 20px;
        }

        .busca-box {
            background: linear-gradient(
                145deg,
                #21142c,
                #140b1b
            );

            border: 1px solid #45245d;
            border-radius: 22px;
            padding: 35px;

            box-shadow:
                0 15px 50px rgba(0,0,0,.4);
        }

        .titulo-busca {
            text-align: center;
            font-size: 34px;
            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #a855f7,
                    #c084fc,
                    #7c3aed
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .campo-busca {
            display: flex;
            gap: 10px;
            max-width: 700px;
            margin: 0 auto 35px;
        }

        .campo-busca input {
            flex: 1;
            padding: 15px 18px;

            background: #100817;
            color: white;

            border: 1px solid #45245d;
            border-radius: 10px;

            outline: none;
            font-size: 16px;

            transition: .25s;
        }

        .campo-busca input:focus {
            border-color: #a855f7;

            box-shadow:
                0 0 15px rgba(168,85,247,.2);
        }

        .campo-busca button {
            padding: 0 25px;

            border: none;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #9333ea
                );

            color: white;
            font-weight: bold;

            cursor: pointer;

            transition: .25s;
        }

        .campo-busca button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(124,58,237,.35);
        }

        .resultado-usuarios {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 20px;
        }

        .usuario-card {
            background: #160d1e;

            border: 1px solid #352044;

            border-radius: 16px;

            padding: 22px;

            text-align: center;

            transition: .3s;
        }

        .usuario-card:hover {
            transform: translateY(-5px);

            border-color: #7c3aed;

            box-shadow:
                0 12px 30px rgba(0,0,0,.3);
        }

        .foto-usuario {
            width: 105px;
            height: 105px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #7c3aed;

            box-shadow:
                0 0 25px
                rgba(124,58,237,.3);

            margin-bottom: 12px;
        }

        .sem-foto-usuario {
            width: 105px;
            height: 105px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #251532;

            border: 4px solid #7c3aed;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #888;
        }

        .usuario-nome {
            color: white;

            font-size: 20px;

            margin: 8px 0 3px;
        }

        .usuario-username {
            color: #a855f7;

            font-size: 14px;

            margin-bottom: 15px;
        }

        .botao-perfil {
            display: inline-block;

            padding: 10px 20px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #9333ea
                );

            color: white;

            text-decoration: none;

            border-radius: 9px;

            font-weight: bold;

            transition: .25s;
        }

        .botao-perfil:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(124,58,237,.3);
        }

        .mensagem {
            background: #160d1e;

            border: 1px solid #352044;

            padding: 30px;

            border-radius: 14px;

            text-align: center;

            color: #999;

            margin-top: 20px;
        }

        @media(max-width:600px) {

            .busca-container {
                padding: 10px;
                margin: 25px auto;
            }

            .busca-box {
                padding: 20px;
            }

            .campo-busca {
                flex-direction: column;
            }

            .campo-busca button {
                padding: 14px;
            }

        }

    </style>

<style>
/* NAVEGAÇÃO UNIFICADA */
.inventory-header{min-height:74px;height:auto;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:12px clamp(18px,5vw,64px);background:rgba(12,9,17,.96);border-bottom:1px solid #30263a;position:sticky;top:0;z-index:1000;backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(0,0,0,.24)}
.inventory-brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;color:#f5f3f7;text-decoration:none;font:700 19px 'DM Sans',Arial,sans-serif;letter-spacing:.13em}.inventory-brand:hover{color:#fff}.inventory-brand-icon{width:148px;height:46px;object-fit:contain}.brand-dot{color:#a855f7}
.inventory-nav{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;margin:0}.inventory-nav a{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:8px;color:#aaa1b4;text-decoration:none;font:600 12px 'DM Sans',Arial,sans-serif;letter-spacing:.02em;white-space:nowrap;transition:background .2s,color .2s}.inventory-nav a:hover,.inventory-nav a.nav-current{background:rgba(124,58,237,.16);color:#fff}.inventory-nav a.inventory-exit{margin-left:5px;border:1px solid #493252;color:#cbb8dc}.inventory-nav a.inventory-exit:hover{border-color:#8b5cf6;background:rgba(124,58,237,.2)}
@media(max-width:760px){.inventory-header{align-items:flex-start;flex-direction:column;gap:10px;padding:12px 16px}.inventory-brand-icon{width:120px;height:38px}.inventory-nav{width:100%;justify-content:flex-start;gap:3px}.inventory-nav a{padding:8px 9px;font-size:11px}.inventory-nav a.inventory-exit{margin-left:0}}
</style>

</head>

<body>

<header class="inventory-header">
  <a class="inventory-brand" href="index.html"><img src="logo.png" alt="Inventory" class="inventory-brand-icon"></a>
  <nav class="inventory-nav" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a href="jogos">Jogos</a>
    <a href="biblioteca">Biblioteca</a>
    <a href="listas">Listas</a>
    <a class="nav-current " href="buscar-usuarios">Buscar usuários</a>
    <a href="perfil">Meu perfil</a>
    <a class="inventory-exit" href="logout">Sair</a>
  </nav>
</header>


<main class="busca-container">

    <div class="busca-box">

        <h2 class="titulo-busca">
            🔎 Buscar usuários
        </h2>

        <p class="subtitulo">
            Encontre outros jogadores do Inventory.
        </p>


        <form
            class="campo-busca"
            method="GET"
            action="buscar-usuarios"
        >

            <input
                type="text"
                id="campoUsuario"
                name="busca"
                placeholder="Digite o nome, username ou e-mail..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Buscar
            </button>

        </form>


        <div
            id="resultadoUsuarios"
            class="resultado-usuarios"
        >

            <div class="mensagem">

                👥

                <p>
                    Digite um nome ou username
                    para encontrar usuários.
                </p>

            </div>

        </div>

    </div>

</main>


</body>

</html>
