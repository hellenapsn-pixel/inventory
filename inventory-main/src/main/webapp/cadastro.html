<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Inventory</title>

    <link rel="icon" type="image/png" href="icon.png">

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(168, 85, 247, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(124, 58, 237, 0.2),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #09060d,
                    #160d20,
                    #0b0710
                );

            overflow-x: hidden;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-header {
            width: 42px;
            height: 42px;
            object-fit: contain;
            display: block;
        }

        .logo-area h1 {
            margin: 0;
        }

        /* =========================================
           CONTAINER
        ========================================= */

        .cadastro-container {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* =========================================
           CARD
        ========================================= */

        .cadastro-box {
            width: 100%;
            max-width: 520px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 22, 48, 0.97),
                    rgba(18, 11, 25, 0.98)
                );

            border: 1px solid rgba(168, 85, 247, 0.3);

            border-radius: 22px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(124, 58, 237, 0.08);

            position: relative;

            overflow: hidden;

            animation: aparecer 0.5s ease;
        }

        .cadastro-box::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: #9333ea;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.12;

            top: -80px;
            right: -50px;
        }

        .cadastro-box h2 {
            text-align: center;

            font-family: 'Orbitron', sans-serif;

            font-size: 24px;

            margin-bottom: 26px;

            color: white;

            position: relative;
        }

        /* =========================================
           CAMPOS
        ========================================= */

        .campo-cadastro {
            margin-bottom: 16px;

            position: relative;
        }

        .linha-dupla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .campo-cadastro label {
            display: block;

            margin-bottom: 6px;

            color: #ddd;

            font-weight: 600;

            font-size: 13px;
        }

        .campo-cadastro small {
            display: block;
            margin-top: 6px;
            color: #756a7e;
            font-size: 12px;
        }

        /* =========================================
           BOTÃO CRIAR CONTA
        ========================================= */

        .botao-criar-conta {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            font-family: 'Orbitron', sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        .botao-criar-conta:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(124, 58, 237, 0.35);

            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #c084fc
                );
        }

        /* =========================================
           LOGIN LINK / VOLTAR
        ========================================= */

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #92879c;

            font-size: 14px;

            position: relative;
        }

        .login-link a {
            color: #c084fc;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            color: white;
        }

        .voltar {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #746a7d;

            text-decoration: none;

            font-size: 13px;

            position: relative;
        }

        .voltar:hover {
            color: #c084fc;
        }

        /* =========================================
           MENSAGENS DE ERRO / SUCESSO
        ========================================= */

        #mensagemCadastro {
            display: none;
            position: relative;
        }

        /* =========================================
           ANIMAÇÃO
        ========================================= */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .cadastro-container {
                padding: 25px 12px;
            }

            .cadastro-box {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .cadastro-box h2 {
                font-size: 21px;
            }

            .linha-dupla {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

<style>

.inventory-brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;color:#f5f3f7;text-decoration:none;font:700 19px 'DM Sans',Arial,sans-serif;letter-spacing:.13em}.inventory-brand:hover{color:#fff}.inventory-brand-icon{width:36px;height:36px;object-fit:contain}.brand-dot{color:#a855f7}
.inventory-nav{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;margin:0}.inventory-nav a{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:8px;color:#aaa1b4;text-decoration:none;font:600 12px 'DM Sans',Arial,sans-serif;letter-spacing:.02em;white-space:nowrap;transition:background .2s,color .2s}.inventory-nav a:hover,.inventory-nav a.nav-current{background:rgba(124,58,237,.16);color:#fff}.inventory-nav a.inventory-exit{margin-left:5px;border:1px solid #493252;color:#cbb8dc}.inventory-nav a.inventory-exit:hover{border-color:#8b5cf6;background:rgba(124,58,237,.2)}

.home-inventory .recent-releases{margin:25px 0 0}.home-inventory .releases-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.home-inventory .releases-kicker{color:#c4a8e2;font:700 .64rem 'DM Sans',sans-serif;letter-spacing:.18em}.home-inventory .releases-period{color:#81758d;font:600 .59rem 'DM Sans',sans-serif;letter-spacing:.12em}

.home-inventory .releases-feature:before{content:'';position:absolute;z-index:-1;width:270px;height:270px;right:23%;top:-130px;border:1px solid rgba(192,132,252,.16);border-radius:50%;box-shadow:0 0 0 28px rgba(192,132,252,.025),0 0 0 58px rgba(192,132,252,.02)}.home-inventory .release-main,.home-inventory .release-list{position:relative;z-index:1}.home-inventory .release-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.home-inventory .release-tag{display:inline-flex;padding:6px 9px;border:1px solid rgba(192,132,252,.32);border-radius:4px;color:#d8b9fa;font:700 .58rem 'DM Sans',sans-serif;letter-spacing:.15em}.home-inventory .release-main h1{margin:17px 0 8px;font:700 clamp(1.8rem,3.4vw,2.8rem)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.055em}.home-inventory .release-main h1 em{color:#c084fc;font-style:normal}.home-inventory .release-main p{max-width:380px;color:#b9adbf;font:400 .85rem/1.6 'DM Sans',sans-serif}.home-inventory .release-feature-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px;color:#d4c6df;font:600 .64rem 'DM Sans',sans-serif;letter-spacing:.06em}.home-inventory .release-feature-meta span{padding:7px 9px;background:rgba(9,6,13,.38);border:1px solid rgba(201,175,233,.13);border-radius:5px}

@media(max-width:680px){.home-inventory .releases-feature{grid-template-columns:1fr;gap:18px;padding:22px 19px}.home-inventory .release-list{border-left:0;border-top:1px solid rgba(201,175,233,.16);padding:13px 0 0}.home-inventory .release-main h1{font-size:2rem}.home-inventory .release-item{padding:10px 0}.home-inventory .releases-period{font-size:.52rem}}
</style>

</head>

<body>

<header class="inventory-header">
  <a class="inventory-brand" href="index.html"><img src="icon.png" alt="" class="inventory-brand-icon"><span>INVENTORY<span class="brand-dot">.</span></span></a>
  <nav class="inventory-nav" aria-label="Navegação principal">
    <a href="index.html">Explorar</a>
    <a href="jogos">Jogos</a>
    <a href="buscar-usuarios">Comunidade</a>
    <a href="login.html">Entrar</a>
  </nav>
</header>


<main class="cadastro-container">

    <section class="cadastro-box">

        <h2>Criar conta</h2>

        <div class="erro" id="mensagemCadastro"></div>

        <form action="cadastro"
              method="POST"
              enctype="multipart/form-data">

            <div class="campo-cadastro">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome completo"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="username">Nome de usuário</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="@username"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="linha-dupla">

                <div class="campo-cadastro">
                    <label for="pais">País</label>
                    <input
                        type="text"
                        id="pais"
                        name="pais"
                        placeholder="Seu país"
                    >
                </div>


            </div>

            <div class="campo-cadastro">
                <label for="bio">Sobre você</label>
                <textarea
                    id="bio"
                    name="bio"
                    class="campo-resenha"
                    placeholder="Fale um pouco sobre você..."
                ></textarea>
            </div>

            <div class="campo-cadastro">
                <label for="foto">Foto de perfil</label>
                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                >
                <small>JPG, PNG ou WEBP, até 5MB.</small>
            </div>

            <button type="submit" class="botao-criar-conta">
                Criar conta
            </button>

        </form>

        <p class="login-link">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

        <a href="index.html" class="voltar">
            ← Voltar para o início
        </a>

    </section>

</main>

<script>

    const mensagensErro = {
        campos: "Preencha todos os campos obrigatórios.",
        email: "Digite um e-mail válido.",
        email_existente: "Já existe uma conta com esse e-mail.",
        username: "Esse nome de usuário já está em uso.",
        senha: "A senha deve ter pelo menos 6 caracteres.",
        foto: "Não foi possível ler o arquivo da foto enviada.",
        formato: "Formato de foto inválido. Use JPG, PNG ou WEBP.",
        salvar: "Não foi possível concluir o cadastro. Tente novamente.",
        servidor: "Ocorreu um erro no servidor. Tente novamente mais tarde."
    };

    const parametros = new URLSearchParams(window.location.search);
    const erro = parametros.get("erro");
    const caixaMensagem = document.getElementById("mensagemCadastro");

    if (erro && mensagensErro[erro]) {
        caixaMensagem.textContent = mensagensErro[erro];
        caixaMensagem.style.display = "block";
    }

</script>

</body>

</html>
